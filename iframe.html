<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <title>Видео из двух источников</title>
    <!-- Фавикон: иконка вкладки браузера -->
    <link rel="icon" type="image/png" href="https://dmistrewaq.github.io/Assets/warning.png">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #f5f5f5;
      }
      .page-wrapper {
        max-width: 1000px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        color: #333;
      }
      /* Контейнер для каждого видео */
      .video-card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        padding: 15px;
        margin-bottom: 30px;
      }
      .video-title {
        margin: 0 0 10px 0;
        font-size: 1.1em;
        color: #222;
      }
      /* Адаптивный iframe 16:9 */
      .embed-responsive {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 */
        height: 0;
        overflow: hidden;
        margin-top: 10px;
      }
      .embed-responsive iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      .link-row {
        margin-top: 12px;
      }
      .link-row a {
        color: #007bff;
        text-decoration: none;
        font-size: 0.95em;
      }
      .link-row a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="page-wrapper">
      <h1>Видео из двух источников</h1>

      <!-- YouTube -->
      <div class="video-card">
        <h3 class="video-title">YouTube: 7‑й ролик из «Цифрового цирка»</h3>
        <div class="embed-responsive">
          <iframe
            src="https://www.youtube.com/embed/oaOG1xOk7XY"
            title="YouTube: Цифровой цирк, серия 7"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
        <div class="link-row">
          <a href="https://www.youtube.com/watch?v=oaOG1xOk7XY" target="_blank">Смотреть на YouTube</a>
        </div>
      </div>

      <!-- Rutube -->
      <div class="video-card">
        <h3 class="video-title">Rutube: твой ролик</h3>
        <div class="embed-responsive">
          <iframe
            src="https://rutube.ru/play/embed/6920781bf90e3344df9d051bec4d4752"
            title="Rutube: видео по ссылке"
            allow="clipboard-write; autoplay; encrypted-media"
            allowfullscreen
          ></iframe>
        </div>
        <div class="link-row">
          <a href="https://rutube.ru/video/6920781bf90e3344df9d051bec4d4752/" target="_blank">Смотреть на Rutube</a>
        </div>
      </div>
    </div>
  </body>
</html>
