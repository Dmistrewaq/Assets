<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аккаунты понарошку с числом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        #message {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
        .success { color: green; }
        .error { color: red; }
        
        /* Стили для страницы аккаунта */
        #accountPage {
            display: none; /* скрыто по умолчанию */
        }
        #currentNumber {
            font-weight: bold;
            font-size: 18px;
            margin: 16px 0;
            text-align: center;
        }
        .controls button {
            margin: 0 4px;
        }
    </style>
</head>
<body>

<!-- Страница регистрации/входа -->
<div class="container" id="authPage">
    <h2 id="pageTitle">Регистрация</h2>
    <form id="authForm">
        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="name@example.com">

        <label for="password">Пароль:</label>
        <input type="password" id="password" required placeholder="Минимум 6 символов">

        <button type="submit" id="actionButton">Зарегистрироваться</button>
    </form>
    <div id="message"></div>
    <div style="margin-top:16px; text-align:center;">
        <a href="#" id="toggleMode">Уже есть аккаунт? Войти</a>
    </div>
</div>

<!-- Страница аккаунта -->
<div class="container" id="accountPage">
    <h2>Личный кабинет</h2>
    <p>Вы вошли как: <span id="loggedEmail" style="font-weight:bold;"></span></p>
    
    <div id="currentNumber">Число: 0</div>

    <div class="controls">
        <button onclick="changeNumber(-1)">−1</button>
        <button onclick="changeNumber(1)">+1</button>
        <button onclick="setCustomNumber()" style="background:#28a745">Задать своё число</button>
    </div>

    <button onclick="logout()" style="margin-top:16px; background:#dc3545">Выйти</button>
</div>

<script>
    const authPage = document.getElementById('authPage');
    const accountPage = document.getElementById('accountPage');
    const authForm = document.getElementById('authForm');
    const pageTitle = document.getElementById('pageTitle');
    const actionButton = document.getElementById('actionButton');
    const toggleMode = document.getElementById('toggleMode');
    const messageBox = document.getElementById('message');
    const loggedEmail = document.getElementById('loggedEmail');
    const currentNumberDisplay = document.getElementById('currentNumber');

    let isLoginMode = false; // false = регистрация, true = вход

    toggleMode.addEventListener('click', function (e) {
        e.preventDefault();
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            pageTitle.textContent = 'Вход';
            actionButton.textContent = 'Войти';
            toggleMode.textContent = 'Нет аккаунта? Зарегистрироваться';
        } else {
            pageTitle.textContent = 'Регистрация';
            actionButton.textContent = 'Зарегистрироваться';
            toggleMode.textContent = 'Уже есть аккаунт? Войти';
        }
        showMessage('');
    });

    authForm.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (password.length < 6) {
            showMessage('Пароль должен быть не короче 6 символов.', 'error');
            return;
        }

        const key = 'user_' + email;
        const existing = localStorage.getItem(key);

        if (!isLoginMode) { // Регистрация
            if (existing) {
                showMessage('Такой email уже зарегистрирован.', 'error');
                return;
            }
            const userData = JSON.stringify({ email, password, number: 0 });
            localStorage.setItem(key, userData);
            showMessage('Аккаунт успешно создан!', 'success');
            setTimeout(() => {
                loginUser(email, password);
            }, 1000);
        } else { // Вход
            if (!existing) {
                showMessage('Такого аккаунта нет.', 'error');
                return;
            }
            const userData = JSON.parse(existing);
            if (userData.password !== password) {
                showMessage('Неверный пароль.', 'error');
                return;
            }
            loginUser(email, password);
        }
    });

    function loginUser(email, password) {
        const key = 'user_' + email;
        const userData = JSON.parse(localStorage.getItem(key));

        loggedEmail.textContent = userData.email;
        currentNumberDisplay.textContent = 'Число: ' + userData.number;

        authPage.style.display = 'none';
        accountPage.style.display = 'block';
        showMessage('');
    }

    function changeNumber(delta) {
        const key = getCurrentUserKey();
        if (!key) return;
        const userData = JSON.parse(localStorage.getItem(key));
        userData.number += delta;
        localStorage.setItem(key, JSON.stringify(userData));
        currentNumberDisplay.textContent = 'Число: ' + userData.number;
    }

    async function setCustomNumber() {
        const newValStr = prompt('Введите новое число:');
        if (newValStr === null) return; // отмена
        const newVal = Number(newValStr);
        if (Number.isNaN(newVal)) {
            alert('Это не число!');
            return;
        }
        const key = getCurrentUserKey();
        if (!key) return;
        const userData = JSON.parse(localStorage.getItem(key));
        userData.number = newVal;
        localStorage.setItem(key, JSON.stringify(userData));
        currentNumberDisplay.textContent = 'Число: ' + userData.number;
    }

    function getCurrentUserKey() {
        // Ищем любой активный аккаунт (простой способ для этой задачи)
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('user_')) {
                // Тут можно усложнить логику, если будет несколько одновременных сессий
                return key;
            }
        }
        return null;
    }

    function logout() {
        authPage.style.display = 'block';
        accountPage.style.display = 'none';
        showMessage('');
    }

    function showMessage(text, type = '') {
        messageBox.textContent = text;
        messageBox.className = 'message ' + (type ? type : '');
    }
</script>

</body>
</html>
