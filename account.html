<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Аккаунты понарошку с числом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            width: 320px;
        }
        h2 {
            text-align: center;
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        #message {
            margin-top: 12px;
            text-align: center;
            font-size: 14px;
        }
        .success { color: green; }
        .error { color: red; }

        #accountPage {
            display: none;
        }
        #currentNumber {
            font-weight: bold;
            font-size: 18px;
            margin: 16px 0;
            text-align: center;
        }
        .controls button {
            margin: 0 4px;
        }

        /* Исправленное выравнивание чекбокса и текста */
        .toggle-password-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            user-select: none;
        }
        .toggle-password-label input {
            margin: 0;
            width: auto;
        }
    </style>
</head>
<body>

<div class="container" id="authPage">
    <h2 id="pageTitle">Регистрация</h2>
    <form id="authForm">
        <label for="email">Email:</label>
        <input type="email" id="email" required placeholder="name@example.com">

        <label for="password">Пароль:</label>
        <input type="password" id="password" required placeholder="Минимум 6 символов">

        <!-- Чекбокс теперь ровно в одну строку с текстом -->
        <label class="toggle-password-label">
            <input type="checkbox" id="showPasswordCheck">
            Показать пароль
        </label>

        <button type="submit" id="actionButton">Зарегистрироваться</button>
    </form>
    <div id="message"></div>
    <div style="margin-top:16px; text-align:center;">
        <a href="#" id="toggleMode">Уже есть аккаунт? Войти</a>
    </div>
</div>

<div class="container" id="accountPage">
    <h2>Личный кабинет</h2>
    <p>Вы вошли как: <span id="loggedEmail" style="font-weight:bold;"></span></p>
    
    <div id="currentNumber">Число: 0</div>

    <div class="controls">
        <button onclick="changeNumber(-1)">−1</button>
        <button onclick="changeNumber(1)">+1</button>
        <button onclick="setCustomNumber()" style="background:#28a745">Задать своё число</button>
    </div>

    <button onclick="logout()" style="margin-top:16px; background:#dc3545">Выйти</button>
</div>

<script>
    const authPage = document.getElementById('authPage');
    const accountPage = document.getElementById('accountPage');
    const authForm = document.getElementById('authForm');
    const pageTitle = document.getElementById('pageTitle');
    const actionButton = document.getElementById('actionButton');
    const toggleMode = document.getElementById('toggleMode');
    const messageBox = document.getElementById('message');
    const loggedEmail = document.getElementById('loggedEmail');
    const currentNumberDisplay = document.getElementById('currentNumber');
    const passwordInput = document.getElementById('password');
    const showPasswordCheck = document.getElementById('showPasswordCheck');

    let isLoginMode = false;
    let isProcessing = false;

    toggleMode.addEventListener('click', function (e) {
        e.preventDefault();
        if (isProcessing) return;
        isLoginMode = !isLoginMode;
        if (isLoginMode) {
            pageTitle.textContent = 'Вход';
            actionButton.textContent = 'Войти';
            toggleMode.textContent = 'Нет аккаунта? Зарегистрироваться';
        } else {
            pageTitle.textContent = 'Регистрация';
            actionButton.textContent = 'Зарегистрироваться';
            toggleMode.textContent = 'Уже есть аккаунт? Войти';
        }
        messageBox.textContent = '';
    });

    authForm.addEventListener('submit', function (e) {
        e.preventDefault();
        if (isProcessing) return;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();

        if (password.length < 6) {
            messageBox.textContent = 'Пароль должен быть не короче 6 символов.';
            messageBox.className = 'message error';
            return;
        }

        isProcessing = true;
        actionButton.disabled = true;
        messageBox.textContent = '';

        setTimeout(() => {
            const key = 'user_' + email;
            const existing = localStorage.getItem(key);

            if (!isLoginMode) { // Регистрация
                if (existing) {
                    messageBox.textContent = 'Такой email уже зарегистрирован.';
                    messageBox.className = 'message error';
                    finishProcessing();
                    return;
                }
                const userData = JSON.stringify({ email, password, number: 0 });
                localStorage.setItem(key, userData);
                messageBox.textContent = 'Аккаунт успешно создан!';
                messageBox.className = 'message success';
                setTimeout(() => loginUser(email, password), 500);
            } else { // Вход
                if (!existing) {
                    messageBox.textContent = 'Такого аккаунта нет.';
                    messageBox.className = 'message error';
                    finishProcessing();
                    return;
                }
                const userData = JSON.parse(existing);
                if (userData.password !== password) {
                    messageBox.textContent = 'Неверный пароль.';
                    messageBox.className = 'message error';
                    finishProcessing();
                    return;
                }
                loginUser(email, password);
            }
        }, 2000);
    });

    function loginUser(email, password) {
        const key = 'user_' + email;
        const userData = JSON.parse(localStorage.getItem(key));
        loggedEmail.textContent = userData.email;
        currentNumberDisplay.textContent = 'Число: ' + userData.number;
        authPage.style.display = 'none';
        accountPage.style.display = 'block';
        finishProcessing();
    }

    function changeNumber(delta) {
        const key = getCurrentUserKey();
        if (!key) return;
        const userData = JSON.parse(localStorage.getItem(key));
        userData.number += delta;
        localStorage.setItem(key, JSON.stringify(userData));
        currentNumberDisplay.textContent = 'Число: ' + userData.number;
    }

    async function setCustomNumber() {
        const newValStr = prompt('Введите новое число:');
        if (newValStr === null) return;
        const newVal = Number(newValStr);
        if (Number.isNaN(newVal)) {
            alert('Это не число!');
            return;
        }
        const key = getCurrentUserKey();
        if (!key) return;
        const userData = JSON.parse(localStorage.getItem(key));
        userData.number = newVal;
        localStorage.setItem(key, JSON.stringify(userData));
        currentNumberDisplay.textContent = 'Число: ' + userData.number;
    }

    function getCurrentUserKey() {
        for (let i = 0; i < localStorage.length; i++) {
            const key = localStorage.key(i);
            if (key.startsWith('user_')) {
                return key;
            }
        }
        return null;
    }

    function logout() {
        authPage.style.display = 'block';
        accountPage.style.display = 'none';
        messageBox.textContent = '';
        passwordInput.type = 'password';
        showPasswordCheck.checked = false;
        isProcessing = false;
    }

    function togglePassword() {
        if (showPasswordCheck.checked) {
            passwordInput.type = 'text';
        } else {
            passwordInput.type = 'password';
        }
    }

    function finishProcessing() {
        isProcessing = false;
        actionButton.disabled = false;
    }
</script>

</body>
</html>
